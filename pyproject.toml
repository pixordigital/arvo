[project]
name = "arvo"
version = "0.1.0"
description = "ARVO — AI Revenue Value Orchestrator"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "gunicorn>=23.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.31.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "httpx>=0.28.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    "passlib[bcrypt]>=1.7.4",
    "pyjwt>=2.9.0",
    "redis>=5.0.0",
    "arq>=0.25",
    "supabase>=2.0.0",
    "prometheus-fastapi-instrumentator>=6.1.0",
    "httpx>=0.28.0",
]

[project.scripts]
arvo = "app.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E", "F"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
