services:
  web:
    build: .
    ports:
      - "9777:9777"
    env_file: .env
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "app.workers.runner"]
    env_file: .env
    depends_on:
      - redis
    restart: unless-stopped
