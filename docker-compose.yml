services:
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      ARVO_SKIP_MIGRATIONS: "1"
      ARVO_DATABASE_URL: "${ARVO_DATABASE_URL:?Set ARVO_DATABASE_URL to Supabase Postgres DSN}"
    restart: "no"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${ARVO_REDIS_PASSWORD:-changeme}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${ARVO_REDIS_PASSWORD:-changeme}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    ports:
      - "9777:9777"
    env_file: .env
    environment:
      ARVO_SKIP_MIGRATIONS: "1"
      ARVO_REDIS_URL: "redis://:${ARVO_REDIS_PASSWORD:-changeme}@redis:6379/0"
      ARVO_DATABASE_URL: "${ARVO_DATABASE_URL:?Set ARVO_DATABASE_URL to Supabase Postgres DSN}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "app.workers.runner"]
    healthcheck:
      disable: true
    env_file: .env
    environment:
      ARVO_SKIP_MIGRATIONS: "1"
      ARVO_REDIS_URL: "redis://:${ARVO_REDIS_PASSWORD:-changeme}@redis:6379/0"
      ARVO_DATABASE_URL: "${ARVO_DATABASE_URL:?Set ARVO_DATABASE_URL to Supabase Postgres DSN}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
