services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arvo}
      POSTGRES_USER: ${POSTGRES_USER:-arvo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arvo} -d ${POSTGRES_DB:-arvo}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      ARVO_SKIP_MIGRATIONS: "1"
      ARVO_DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-arvo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-arvo}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${ARVO_REDIS_PASSWORD:-changeme}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${ARVO_REDIS_PASSWORD:-changeme}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    ports:
      - "9777:9777"
    env_file: .env
    environment:
      ARVO_SKIP_MIGRATIONS: "1"
      ARVO_REDIS_URL: "redis://:${ARVO_REDIS_PASSWORD:-changeme}@redis:6379/0"
      ARVO_DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-arvo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-arvo}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "app.workers.runner"]
    healthcheck:
      disable: true
    env_file: .env
    environment:
      ARVO_SKIP_MIGRATIONS: "1"
      ARVO_REDIS_URL: "redis://:${ARVO_REDIS_PASSWORD:-changeme}@redis:6379/0"
      ARVO_DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-arvo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-arvo}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
