{% extends "base.html" %}
{% block content %}
<div class="max-w-5xl">
  <h2 class="font-semibold mb-4">Deals — {{ deals|length }}</h2>
  <div class="space-y-2">{% for d in deals %}<div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex justify-between"><div><div class="font-medium">{{ d.name }}</div><div class="text-xs text-slate-400">{{ d.stage }}</div></div><div class="font-bold">R$ {{ d.amount }} <span class="text-xs text-slate-400">{{ d.currency }}</span></div></div>{% endfor %}</div>
</div>
{% endblock %}
