{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto py-8 md:py-16">
  <div class="card p-6 md:p-8">
    <h2 class="text-2xl font-bold mb-2" style="color:hsl(var(--foreground))">Login</h2>
    <p class="text-sm text-[hsl(var(--muted-foreground))] mb-6">Token salvo em cookie <code>arvo_token</code>. Sessions duram 1 hora.</p>
    {% if error %}
    <div class="mb-4 p-3 rounded-md bg-[hsl(var(--destructive)/0.1)] border border-[hsl(var(--destructive))] text-sm" style="color:hsl(var(--destructive))">{{ error }}</div>
    {% endif %}
    <form class="space-y-4" method="post">
      <div>
        <label class="block text-sm font-medium mb-2" style="color:hsl(var(--foreground))">Email</label>
        <input type="email" name="email" required class="input" placeholder="email@arvo.test" autocomplete="email" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-2" style="color:hsl(var(--foreground))">Password</label>
        <input type="password" name="password" required class="input" placeholder="password" autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary w-full touch-target mt-2">Entrar</button>
    </form>
    <p class="mt-6 text-center text-xs text-[hsl(var(--muted-foreground))]">Sem conta? <a href="/register" class="underline hover:text-[hsl(var(--primary))]">Criar org</a> • <a href="/api/docs" class="underline hover:text-[hsl(var(--primary))]">via API</a></p>
  </div>
</div>
{% endblock %}
