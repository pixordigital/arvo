{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-xl p-6">
  <h2 class="font-semibold">Login</h2>
  <p class="text-xs text-slate-400 mt-1">Entre com org existente. Token salvo em cookie <code>arvo_token</code>.</p>
  <form method="post" action="/login" class="mt-4 space-y-3">
    <input name="email" type="email" placeholder="email" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
    <input name="password" type="password" placeholder="password" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
    <button class="w-full bg-white text-slate-900 rounded-lg py-2 text-sm font-medium">Entrar</button>
  </form>
  {% if error %}<div class="mt-3 text-xs text-red-400">{{ error }}</div>{% endif %}
  <div class="mt-3 text-xs text-slate-500">Sem conta? <a href="/register" class="underline">Criar org</a> • <a href="/api/docs" class="underline">via API</a></div>
</div>
{% endblock %}
