{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
  <div class="text-center mb-6"><div class="logo-mark mx-auto mb-3">A</div><h1 class="text-2xl font-bold tracking-tight t-fg">Login</h1><p class="page-sub mt-2">Token salvo em cookie <code>arvo_token</code>. Sessions duram 1 hora.</p></div>
  <div class="card card-content elev-2">
    {% if error %}<div class="alert-error" role="alert">{{ error }}</div>{% endif %}
    <form class="form-stack" method="post">
      <div class="field"><label for="login-email">Email</label><input id="login-email" type="email" name="email" required class="input" placeholder="email@arvo.test" autocomplete="email" /></div>
      <div class="field"><label for="login-pass">Password</label><input id="login-pass" type="password" name="password" required class="input" placeholder="••••••••" autocomplete="current-password" /></div>
      <button type="submit" class="btn btn-primary w-full pressable">Entrar</button>
    </form>
    <p class="auth-foot">Sem conta? <a href="/register" class="link">Criar org</a> · <a href="/api/docs" class="link">via API</a></p>
  </div>
</div>
{% endblock %}
