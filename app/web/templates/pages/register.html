{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-xl p-6">
  <h2 class="font-semibold">Criar organização</h2>
  <p class="text-xs text-slate-400 mt-1">OWNER criado + org vinculada. Plano inicial: <code>starter</code>.</p>
  <form method="post" action="/register" class="mt-4 space-y-3">
    <input name="email" type="email" placeholder="email" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
    <input name="password" type="password" placeholder="password (≥6)" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
    <input name="org_name" placeholder="Nome da organização" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
    <input name="org_slug" placeholder="slug (ex: acme)" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
    <button class="w-full bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg py-2 text-sm font-medium">Criar e entrar</button>
  </form>
  {% if error %}<div class="mt-3 text-xs text-red-400">{{ error }}</div>{% endif %}
  <div class="mt-3 text-xs text-slate-500">Já tem conta? <a href="/login" class="underline">Login</a></div>
</div>
{% endblock %}
