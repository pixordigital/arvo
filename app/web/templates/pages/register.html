{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
  <div class="text-center mb-6"><div class="logo-mark mx-auto mb-3">A</div><h1 class="text-2xl font-bold tracking-tight t-fg">Criar organização</h1><p class="page-sub mt-2">OWNER criado + org vinculada. Plano inicial: <code>starter</code>.</p></div>
  <div class="card card-content elev-2">
    {% if error %}<div class="alert-error" role="alert">{{ error }}</div>{% endif %}
    <form class="form-stack" method="post">
      <div class="field"><label for="reg-email">Email</label><input id="reg-email" type="email" name="email" required class="input" placeholder="email@arvo.test" autocomplete="email" /></div>
      <div class="field"><label for="reg-pass">Password</label><input id="reg-pass" type="password" name="password" required class="input" placeholder="Mínimo 6 caracteres" autocomplete="new-password" /><span class="help">Mínimo 6 caracteres.</span></div>
      <div class="field"><label for="reg-org">Nome da organização</label><input id="reg-org" type="text" name="org_name" required class="input" placeholder="ARVO" autocomplete="organization" /></div>
      <div class="field"><label for="reg-slug">Slug</label><input id="reg-slug" type="text" name="org_slug" required class="input" placeholder="arvo" autocomplete="off" pattern="[a-z0-9-]+" /><span class="help">Minúsculas, números e hífen.</span></div>
      <button type="submit" class="btn btn-primary w-full pressable">Criar e entrar</button>
    </form>
    <p class="auth-foot">Já tem conta? <a href="/login" class="link">Login</a></p>
  </div>
</div>
{% endblock %}
