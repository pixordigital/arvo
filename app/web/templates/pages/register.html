{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto py-8 md:py-16">
  <div class="card p-6 md:p-8">
    <h2 class="text-2xl font-bold mb-2" style="color:hsl(var(--foreground))">Criar organização</h2>
    <p class="text-sm text-[hsl(var(--muted-foreground))] mb-6">OWNER criado + org vinculada. Plano inicial: <code>starter</code>.</p>
    {% if error %}
    <div class="mb-4 p-3 rounded-md bg-[hsl(var(--destructive)/0.1)] border border-[hsl(var(--destructive))] text-sm" style="color:hsl(var(--destructive))">{{ error }}</div>
    {% endif %}
    <form class="space-y-4" method="post">
      <div>
        <label class="block text-sm font-medium mb-2" style="color:hsl(var(--foreground))">Email</label>
        <input type="email" name="email" required class="input" placeholder="email@arvo.test" autocomplete="email" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-2" style="color:hsl(var(--foreground))">Password</label>
        <input type="password" name="password" required class="input" placeholder="password (≥6)" autocomplete="new-password" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-2" style="color:hsl(var(--foreground))">Nome da organização</label>
        <input type="text" name="org_name" required class="input" placeholder="ARVO" autocomplete="organization" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-2" style="color:hsl(var(--foreground))">Slug</label>
        <input type="text" name="org_slug" required class="input" placeholder="arvo" autocomplete="off" />
      </div>
      <button type="submit" class="btn btn-primary w-full touch-target mt-2" style="background-color:hsl(142 76% 36%);">Criar e entrar</button>
    </form>
    <p class="mt-6 text-center text-xs text-[hsl(var(--muted-foreground))]">Já tem conta? <a href="/login" class="underline hover:text-[hsl(var(--primary))]">Login</a></p>
  </div>
</div>
{% endblock %}
