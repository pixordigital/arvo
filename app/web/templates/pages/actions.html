{% extends "base.html" %}
{% block content %}
<div class="max-w-5xl">
  <h2 class="font-semibold mb-4">Actions — {{ actions|length }}</h2>
  {% for a in actions %}<div class="bg-slate-900 border border-slate-800 rounded-xl p-4 mb-2 flex justify-between"><div><div class="font-medium">{{ a.title }}</div><div class="text-xs text-slate-400">{{ a.status }}</div></div><div class="text-sm {% if a.status=='VERIFIED' %}text-emerald-400{% endif %}">{{ a.verified_amount or "—" }}</div></div>{% endfor %}
</div>
{% endblock %}
