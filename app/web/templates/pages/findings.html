{% extends "base.html" %}
{% block content %}
<div class="max-w-6xl">
  <h2 class="font-semibold mb-4">Findings — {{ findings|length }} ativos</h2>
  <div class="space-y-3">
  {% for f in findings %}
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex justify-between">
      <div><div class="font-medium">{{ f.title }}</div><div class="text-xs text-slate-400">{{ f.kind }} • {{ f.status }} • {{ f.severity }}</div></div>
      <div class="text-right"><div class="font-bold text-amber-400">R$ {{ f.exposure }}</div><div class="text-xs text-slate-500">{{ f.currency }}</div></div>
    </div>
  {% else %}
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 text-sm text-slate-400">Nenhum finding — crie via API ou ingest.</div>
  {% endfor %}
  </div>
</div>
{% endblock %}
